<!DOCTYPE html>

    <style>
        body {

            background-color: rgb(52, 142, 148);

        }

        h2,
        p{
            text-align: center;

        .table{
            width: 100%;
            border-collapse: collapse;  /* menghilangkan border kecil ditable */
            margin-top: 20px;
            font-size: 15px;
        }

        .card-table{
            background-color: #fff;
            padding: 30px;
            border-radius: 13px;
            box-shadow: 0 0 19px #ff0000;
            width: 80%;
            max-width: 800px;
            margin: 50px auto;
        }

        .table thead tr{
            background-color: rgb(15, 143, 255);
            color: rgb(248, 254, 255);
            text-align: center;
        }

        .table th, .table td{
            border-bottom: 1px solid #000000;
            padding: 12px 15px;

        .btn-plus{

        }

        .btn-tambah{
            display: inline-block; /*button mengikuti panjang karakter tesxt*/
            padding: 10px 20px;
            background-color: green;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }

        .btn-tambah:hover{
            background-color: #218838;
        }
    </style>
</head>
