<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Peserta</title>

    <!-- 
        CSS : Cascading Style Sheet
        CSS : 3 (Internal, External, Inline)
        Internal : yang berada dalam satu file
        external : dibuat didalam file yang berbeda yang dihubungkan dengan link embed
        inline : css kotor intinya, karena jadi satu dengan atruibut :( 
    -->

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(52, 142, 148);
            /* properti     : Value */
            text-align: center;
        }
        
        h2{
            color: rgb(238, 238, 238);
            /* text-align: center; */
        }

        p{
            color:rgb(255, 255, 255);
            font-size: 17px;
            font-weight: 500;
            /* text-align: center */
        }
        
        /* form{
            background-color: aqua;
            margin: 80px;
            border-radius: 10px;
        } */
        .form-group{
            margin-bottom: 10px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 16px;
        }

        input[type='text'],
        input[type='email'],
        input[type='number']{
            width: 50%;
            padding: 10px 15px;
            border-radius: 10px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: rgb(0, 255, 0);
        }

        .btn-submit, .btn-reset{
            width: 50%;
            padding : 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-submit{
            background-color: rgb(63, 63, 235);
            color: aliceblue;
        }

        .btn-reset{
            background-color: rgb(182, 19, 13);
            color: rgb(255, 255, 255);
            font-size: 16px;
        }

        .btn-submit:hover{
            background-color: rgb(154, 155, 252);
        }
        .btn-reset:hover{
            background-color: rgb(245, 95, 90);
        }

        /* button{
            width: 20%;
            padding: 5px 5px;
            border-radius: 10px;

        } */
    </style>
</head>

<body>
    <h2>Pendaftaran Siswa</h2>
    <p>Silahkan isi data diri anda</p>

    <form method="post" action="3.html" enctype="multipart/form-data">
        <div class="form-group">
            <label for="nama">Nama</label>
            <input type="text" name="name" id="name" placeholder="Masukan Nama" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" placeholder="Contoh : Ngapak@gmail.com" required>
        </div>
        <div class="form-group">
            <label for="nama">No. Telp</label>
            <input type="number" placeholder="Format +62- xxx" required>
        </div>
        <div class="form-group">
            <button type="submit" class="btn-submit">Simpan</button>
            <input type="reset" class="btn-reset" value="Batal">
        </div>
    </form>
</body>

</html>
